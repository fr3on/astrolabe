<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Astrolabe: a benchmark of Arabic law. Three Claude models. Exact text from memory 0%, with the text 87% on average.">
  <rect width="1200" height="330" rx="14" fill="#1d1d1b"/>
  <g fill="none" stroke="#f6f5f1" stroke-opacity=".10" stroke-width="2">
    <circle cx="1010" cy="160" r="150"/><circle cx="1010" cy="160" r="105"/><circle cx="1010" cy="160" r="60"/>
    <line x1="860" y1="160" x2="1160" y2="160"/><line x1="1010" y1="10" x2="1010" y2="310"/>
  </g>
  <text x="64" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#f6f5f1">Astrolabe</text>
  <text x="66" y="162" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9c7bf">A benchmark of Arabic law. Saudi Arabia and Egypt.</text>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="66" y="228" font-size="13" letter-spacing="1.6" fill="#8d8b84">EXACT TEXT · 209 QUESTIONS</text>
    <text x="66" y="276" font-size="46" font-weight="700" fill="#8d8b84">0%</text>
    <text x="150" y="274" font-size="32" fill="#8d8b84">→</text>
    <text x="196" y="276" font-size="46" font-weight="700" fill="#f6f5f1">87%</text>
    <text x="470" y="228" font-size="13" letter-spacing="1.6" fill="#8d8b84">TASK CRITERIA · 44 TASKS</text>
    <text x="470" y="276" font-size="46" font-weight="700" fill="#8d8b84">35–51%</text>
    <text x="660" y="274" font-size="32" fill="#8d8b84">→</text>
    <text x="712" y="276" font-size="46" font-weight="700" fill="#f6f5f1">97%</text>
    <text x="66" y="305" font-size="14" fill="#8d8b84">Average of three Claude models, one run each. From memory, then with the exact text in the prompt.</text>
  </g>
